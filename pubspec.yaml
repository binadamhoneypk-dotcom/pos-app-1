name: pos_app
description: "Multi-Business Shop Management App (Offline-First POS with Zakat, Ledgers, Multi-User)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database (offline-first)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # UUID generation for sync-safe primary keys
  uuid: ^4.4.2

  # Networking (talks to your PHP/MySQL REST API)
  http: ^1.2.2

  # Connectivity check before attempting sync
  connectivity_plus: ^6.0.5

  # Simple key-value storage (non-sensitive prefs like language choice)
  shared_preferences: ^2.3.2

  # Secure local storage for auth tokens / session
  flutter_secure_storage: ^9.2.2

  # Password hashing for local (offline) login
  crypto: ^3.0.5

  # Bilingual (Urdu/English) support + RTL/LTR
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # ---------------------------------------------------------------------
  # PHASE 2 ADDITIONS
  # ---------------------------------------------------------------------

  # Barcode / QR camera scanning (Inventory form + Billing "add item" flow)
  mobile_scanner: ^5.2.3

  # Noto Nastaliq Urdu / Noto Sans Arabic, matching the approved HTML
  # prototype's colour + type system exactly.
  google_fonts: ^6.2.1

  # ---------------------------------------------------------------------
  # PHASE 3 ADDITIONS
  # ---------------------------------------------------------------------

  # Reminder feature: opens the OS share sheet with a pre-written
  # SMS/WhatsApp-ready message (lib/features/ledger/reminder_helper.dart).
  share_plus: ^12.0.2
  # Reminder feature: optional direct "WhatsApp پر بھیجیں" quick action
  # via a wa.me deep link when the contact has a phone number saved.
  url_launcher: ^6.3.1

  # ---------------------------------------------------------------------
  # GOOGLE AI STUDIO PROMPT — FEATURE 3
  # ---------------------------------------------------------------------

  # Pick a customer's name+phone straight from the device's contact book
  # (customer_picker_sheet.dart's "نیا گاہک شامل کریں" dialog). Needs
  # READ_CONTACTS on Android — see the note in that screen's file header
  # and the "Action Required" step at the end of this reply: a real,
  # committed android/ folder is required before this permission can
  # persist across CI builds.
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
